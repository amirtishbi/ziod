<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימת אריזה – מכתש רמון</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --accent: #c0622f;
    --border: #e6dfd4;
    --done: #3d8b5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--accent); }
  .subtitle { margin: 0 0 12px; color: var(--muted); }
  .progress {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .bar { height: 8px; background: var(--border); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 10px 0 6px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; border-bottom: 1px dashed var(--border); }
  li:last-child { border-bottom: none; }
  label {
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input[type="checkbox"] {
    width: 22px; height: 22px;
    flex-shrink: 0;
    margin-top: 1px;
    accent-color: var(--done);
  }
  input:checked + span { text-decoration: line-through; color: var(--muted); }
  .del {
    background: none; border: none; color: var(--muted);
    font-size: 1.1rem; padding: 6px 10px; cursor: pointer;
  }
  .add-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-row input {
    flex: 1; min-width: 0;
    padding: 9px 10px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit;
  }
  .add-row button {
    padding: 9px 14px; font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--done);
    border: none; border-radius: 8px; cursor: pointer;
  }
  .reset {
    display: block; width: 100%;
    padding: 14px; margin: 20px 0 30px;
    font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--accent);
    border: none; border-radius: 10px; cursor: pointer;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px;
    padding: 8px 0; margin-bottom: 8px;
    background: var(--bg);
  }
  .toolbar button {
    flex: 1;
    padding: 12px; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    color: #fff;
  }
  #saveBtn { background: var(--done); }
  #missingBtn { background: #4a6fa5; }
  #missingBtn.on { background: #2b4a75; }
  #copyBtn { background: var(--accent); }
  #editBtn { background: #7a6a55; }
  #editBtn.on { background: #4d4234; }
  .act {
    display: none;
    background: none; border: none;
    font-size: 1.1rem; padding: 6px 8px; cursor: pointer;
  }
  body.editing .act { display: inline-block; }
  .edit-note {
    display: none;
    background: #fff4e0; border: 1px solid #f0d9a8;
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
    font-size: .9rem;
  }
  .edit-note a { color: var(--accent); }
  body.editing .edit-note { display: block; }
  @media (max-width: 480px) {
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; }
    .toolbar button { padding: 10px 4px; font-size: .9rem; }
  }
  body.only-missing li.packed,
  body.only-missing section.all-packed { display: none; }
  .empty-msg {
    display: none;
    text-align: center; font-size: 1.1rem; font-weight: 600;
    color: var(--done); padding: 20px;
  }
  body.only-missing.all-done .empty-msg { display: block; }
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: #2b2b2b; color: #fff;
    padding: 10px 18px; border-radius: 20px;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media print {
    body { background: #fff; padding: 0; }
    section { break-inside: avoid; border: 1px solid #999; }
    .progress, .reset, .add-row, .del, .toolbar, .toast { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 רשימת אריזה וחלוקה לתיקים – קמפינג במכתש רמון</h1>
  <p class="subtitle">אמיר, אליה ויובל</p>

  <div class="progress">
    נארזו <span id="count">0</span> מתוך <span id="total">0</span>
    <div class="bar"><span id="barFill"></span></div>
  </div>

  <div class="toolbar">
    <button id="saveBtn">💾 שמור</button>
    <button id="missingBtn">🔍 מה חסר</button>
    <button id="copyBtn">📋 העתק סטטוס</button>
    <button id="editBtn">✏️ עריכה</button>
  </div>
  <div class="edit-note">מצב עריכה: ✏️ לשינוי שם, 🗑️ למחיקה. <a href="#" id="restoreBtn">שחזור פריטים שנמחקו</a></div>

  <div class="empty-msg">🎉 הכול ארוז! לא חסר כלום</div>
  <div id="list"></div>

  <button class="reset" id="resetBtn">🔄 איפוס סימונים</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== הרשימה הקבועה – לעריכה כאן ===== */
const BAGS = [
  { id: "clothes", title: "🧳 תיק 1: בגדים וציוד אישי (תיק נסיעות / צידנית רכה)",
    sub: "👕 לבוש והנעלה (אמיר, אליה ויובל)",
    items: [
      "בגדים חמים לערב וללילה (פליזים, מכנסיים עבים, גרביים חמות)",
      "בגדים קלים/דקים לשעות היום",
      "בגדי ים (לרחצה והירטבות)",
      "כובעים לשמש",
      "נעליים סגורות וגרביים",
      "סנדלים (למקלחת ומסלולי מים)"
    ]},
  { id: "toilet", title: "🧼 תיק 2: טואלטיקה ורחצה",
    items: ["3 מגבות", "שמפו", "מברשות שיניים + משחת שיניים", "מסרק", "מגבונים לחים", "נייר טואלט"]},
  { id: "sleep", title: "⛺ ציוד לינה (לתא המטען / מושב אחורי)",
    items: ["אוהל", "מצעים ושמיכת פוך", "כרית אחת"]},
  { id: "kitchen", title: "📦 ארגז / תיק בישול ומטבח",
    items: ["סיר", "קרש חיתוך", "פומפיה גדולה", "קערות", "סכו\"ם", "כוס נירוסטה (של אליה)", "שקיות זבל"]},
  { id: "food", title: "🧺 תיק / צידנית אוכל ושתייה",
    items: [
      "צידנית (למקרר ברכב/במקום): טופו, ירקות ופירות טריים",
      "תיק יבש: 2 חבילות פסטה, רוטב לפסטה, מלח, קופסאות שימורים (מאבא)",
      "בקבוקי שתייה (למילוי במקום)"
    ]},
  { id: "backpack", title: "🎒 תיק גב קטן (נגיש ליד הנהג ברכב)",
    items: ["בקבוק מים זמין לדרך", "חבילת מגבונים לחים קטנה / נייר טואלט לדרך"]}
];
/* ======================================= */

const KEY = "ramon-packing-v2";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { checked: {}, added: {} }; }
  catch (e) { return { checked: {}, added: {} }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

let state = load();
state.checked = state.checked || {};
state.added = state.added || {};
state.renamed = state.renamed || {};   // שינוי שם לפריט קבוע
state.removed = state.removed || {};   // פריט קבוע שנמחק

function itemRow(bagId, origText, isCustom) {
  const key = bagId + "|" + origText;
  const shown = isCustom ? origText : (state.renamed[key] || origText);
  const li = document.createElement("li");
  const label = document.createElement("label");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = !!state.checked[key];
  cb.addEventListener("change", () => {
    if (cb.checked) state.checked[key] = true; else delete state.checked[key];
    save(); updateProgress();
  });
  const span = document.createElement("span");
  span.textContent = shown;
  label.append(cb, span);
  li.append(label);

  const edit = document.createElement("button");
  edit.className = "act";
  edit.textContent = "✏️";
  edit.title = "עריכה";
  edit.addEventListener("click", () => {
    const t = (prompt("עריכת פריט:", shown) || "").trim();
    if (!t || t === shown) return;
    if (isCustom) {
      const arr = state.added[bagId];
      arr[arr.indexOf(origText)] = t;
      const newKey = bagId + "|" + t;
      if (state.checked[key]) { state.checked[newKey] = true; delete state.checked[key]; }
    } else {
      if (t === origText) delete state.renamed[key]; else state.renamed[key] = t;
    }
    save(); render();
  });

  const del = document.createElement("button");
  del.className = "act";
  del.textContent = "🗑️";
  del.title = "מחיקה";
  del.addEventListener("click", () => {
    if (!confirm("למחוק את \"" + shown + "\"?")) return;
    if (isCustom) state.added[bagId] = state.added[bagId].filter(t => t !== origText);
    else state.removed[key] = true;
    delete state.checked[key];
    save(); render();
  });

  li.append(edit, del);
  return li;
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  BAGS.forEach(bag => {
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = bag.title;
    sec.append(h2);
    if (bag.sub) {
      const h3 = document.createElement("h3");
      h3.textContent = bag.sub;
      sec.append(h3);
    }
    const ul = document.createElement("ul");
    bag.items
      .filter(t => !state.removed[bag.id + "|" + t])
      .forEach(t => ul.append(itemRow(bag.id, t, false)));
    (state.added[bag.id] || []).forEach(t => ul.append(itemRow(bag.id, t, true)));
    sec.append(ul);

    const row = document.createElement("div");
    row.className = "add-row";
    const input = document.createElement("input");
    input.placeholder = "הוספת פריט...";
    const btn = document.createElement("button");
    btn.textContent = "הוספה";
    const add = () => {
      const t = input.value.trim();
      if (!t) return;
      state.added[bag.id] = state.added[bag.id] || [];
      if (!state.added[bag.id].includes(t) && !bag.items.includes(t)) {
        state.added[bag.id].push(t);
        save(); render();
      }
      input.value = "";
    };
    btn.addEventListener("click", add);
    input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    row.append(input, btn);
    sec.append(row);

    list.append(sec);
  });
  updateProgress();
}

function updateProgress() {
  const boxes = document.querySelectorAll('#list input[type="checkbox"]');
  const done = [...boxes].filter(b => b.checked).length;
  document.getElementById("count").textContent = done;
  document.getElementById("total").textContent = boxes.length;
  document.getElementById("barFill").style.width = boxes.length ? (done / boxes.length * 100) + "%" : "0";

  boxes.forEach(b => b.closest("li").classList.toggle("packed", b.checked));
  document.querySelectorAll("#list section").forEach(sec => {
    const all = sec.querySelectorAll('input[type="checkbox"]');
    sec.classList.toggle("all-packed", all.length > 0 && [...all].every(b => b.checked));
  });
  document.body.classList.toggle("all-done", boxes.length > 0 && done === boxes.length);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

document.getElementById("saveBtn").addEventListener("click", () => {
  save();
  toast("✓ נשמר");
});

function packedText() {
  const block = (title, checked, mark) => {
    const out = [title, ""];
    let n = 0;
    document.querySelectorAll("#list section").forEach(sec => {
      const items = [...sec.querySelectorAll('input[type="checkbox"]')]
        .filter(b => b.checked === checked)
        .map(b => b.nextElementSibling.textContent);
      if (!items.length) return;
      out.push(sec.querySelector("h2").textContent);
      items.forEach(t => out.push(mark + " " + t));
      out.push("");
      n += items.length;
    });
    if (!n) out.push(checked ? "עוד לא נארז כלום" : "🎉 לא חסר כלום!", "");
    return out;
  };
  const lines = [
    "🏕️ רשימת אריזה – קמפינג במכתש רמון",
    "",
    ...block("✅ ארזתי:", true, "✔"),
    "──────────",
    "",
    ...block("❌ חסר:", false, "☐")
  ];
  return lines.join("\n").trim();
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy") ? resolve() : reject(); }
    catch (e) { reject(e); }
    ta.remove();
  });
}

document.getElementById("copyBtn").addEventListener("click", () => {
  const text = packedText();
  copyText(text).then(() => toast("✓ הועתק"), () => toast("ההעתקה נכשלה"));
});

document.getElementById("editBtn").addEventListener("click", e => {
  const on = document.body.classList.toggle("editing");
  e.currentTarget.classList.toggle("on", on);
  e.currentTarget.textContent = on ? "✔ סיום עריכה" : "✏️ עריכה";
});

document.getElementById("restoreBtn").addEventListener("click", e => {
  e.preventDefault();
  const n = Object.keys(state.removed).length + Object.keys(state.renamed).length;
  if (!n) { toast("אין מה לשחזר"); return; }
  if (!confirm("להחזיר את הפריטים הקבועים שנמחקו ואת השמות המקוריים?")) return;
  state.removed = {};
  state.renamed = {};
  save(); render();
  toast("✓ שוחזר");
});

document.getElementById("missingBtn").addEventListener("click", e => {
  const on = document.body.classList.toggle("only-missing");
  e.currentTarget.classList.toggle("on", on);
  e.currentTarget.textContent = on ? "📋 הצג הכול" : "🔍 מה חסר";
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("לאפס את כל הסימונים? (פריטים שהוספת יישארו)")) return;
  state.checked = {};
  save(); render();
});

render();
</script>
</body>
</html>
